[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "rustic-audio-tool"
description = "PyO3 audio recording and playback extension for katzenqt push-to-talk"
authors = [{name = "Brett Preston"}]
requires-python = ">=3.11"
dynamic = ["version"]

[tool.maturin]
module-name = "rustic_audio_tool"
