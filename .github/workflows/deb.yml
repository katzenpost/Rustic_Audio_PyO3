name: Debian packages

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      ref_debian_13: ${{ steps.refs.outputs.ref_debian_13 }}
      ref_debian_forky: ${{ steps.refs.outputs.ref_debian_forky }}
      ref_ubuntu_26_04: ${{ steps.refs.outputs.ref_ubuntu_26_04 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - id: refs
        run: make deb-image-refs >> "$GITHUB_OUTPUT"

  image:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        distro:
          - debian-13
          - debian-forky
          - ubuntu-26.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: make deb-image-push DISTRO=${{ matrix.distro }} PODMAN=docker

  deb:
    needs: [tag, image]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        key:
          - ref_debian_13
          - ref_debian_forky
          - ref_ubuntu_26_04
    container:
      image: ${{ needs.tag.outputs[matrix.key] }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: make check-version-test
      - run: make check-version tag=${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - run: make deb-ci

  deb-result:
    needs: deb
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Report the Debian package verdict
        run: |
          result='${{ needs.deb.result }}'
          echo "deb: $result"
          case "$result" in
            success)
              exit 0 ;;
            *)
              echo "::error::the Debian package build did not pass"
              exit 1 ;;
          esac
